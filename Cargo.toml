[package]
name = "farm_service"
version = "0.1.0"
edition = "2024"
description = "Farm service with authenticated user profile collection"
license = "AGPL-3.0-only"
repository = "https://github.com/Shu-Ying/farm_service"
publish = false
default-run = "farm_service"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
